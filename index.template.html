<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supplier Orders</title>
<meta name="theme-color" content="#f5ead8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orders">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// Apply the saved appearance before first paint (System / Light / Dark)
(function(){var t="system";try{t=localStorage.getItem("supplier-orders-theme")||"system"}catch(e){}
var d=t==="dark"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.dataset.theme=d?"dark":"light";
document.querySelector('meta[name="theme-color"]').content=d?"#12141c":"#f5ead8"})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5ead8; --sf:#ebddc5; --card:#f9f4ed; --ink:#201e1d; --mute:#645c50; --line:rgba(32,30,29,.13);
  --acc:#4a5fa8; --accInk:#f9f4ed; --a1:#eef0fb; --a7:#2f3e73; --ok:#56633f; --ok1:#e1eecc;
  --head:Caprasimo,Georgia,serif; --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#12141c; --sf:#1f2230; --card:#191c27; --ink:#eceaf3; --mute:#9fa3b8; --line:rgba(236,234,243,.10);
  --acc:#909ff0; --accInk:#10121a; --a1:#252b4a; --a7:#c9d1ff; --ok:#a9c48f; --ok1:#1d2a22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;display:block}
.wrap{max-width:560px;margin:0 auto}

/* Header */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 20px 10px}
.ctxrow{display:flex;align-items:center;gap:8px}
.ctx{height:34px;border:0;border-radius:999px;background:var(--card);padding:0 14px 0 12px;font:600 13px var(--body);display:flex;align-items:center;gap:7px;min-width:0}
.ctx .ic{width:16px;height:16px}
.ctx .pin{color:var(--acc)} .ctx .chev{color:var(--mute)}
.iconbtn{width:44px;height:44px;margin:-5px -6px -5px auto;border:0;border-radius:999px;background:transparent;display:grid;place-items:center}
.title{font:400 34px/1.1 var(--head);letter-spacing:-.015em;margin:12px 0 0}
.search{margin-top:12px;height:46px;border-radius:999px;background:var(--sf);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;color:var(--mute)}
.search .ic{width:18px;height:18px}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;color:var(--ink);font:15px var(--body)}
.search input::placeholder{color:var(--mute)}
.clear{width:36px;height:36px;border:0;border-radius:999px;background:none;color:var(--mute);display:grid;place-items:center}
.clear .ic{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -20px 0;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font:600 13px var(--body);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip .ic{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Content */
main{padding:4px 16px calc(110px + env(safe-area-inset-bottom))}
main.withfab{padding-bottom:calc(194px + env(safe-area-inset-bottom))}
.empty{padding:60px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font:400 22px var(--head);color:var(--ink);margin-bottom:6px}
.group{margin-top:14px}
.ghead{display:flex;align-items:center;gap:8px;padding:0 4px 8px;min-height:32px}
.gname{font:400 18px/1.2 var(--head);margin:0}
.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--a1);color:var(--a7);white-space:nowrap}
.tag.plain{background:var(--sf);color:var(--mute)}
.ghost{margin-left:auto;border:0;background:none;color:var(--a7);font:700 13px var(--body);display:flex;align-items:center;gap:5px;padding:6px 4px;white-space:nowrap}
.ghost .ic{width:15px;height:15px}
.list{background:var(--card);border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.on{background:var(--a1)}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mute)}
.promo{font-size:12px;font-weight:600;color:var(--a7);margin-top:2px}
.add0{width:44px;height:44px;flex:none;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--a7);display:grid;place-items:center}
.add0:hover{border-color:var(--acc)}
.add0 .ic{width:19px;height:19px}
.qty{display:flex;align-items:center;height:44px;border-radius:999px;background:var(--acc);color:var(--accInk);flex:none}
.qty button{width:44px;height:44px;border:0;background:none;color:inherit;display:grid;place-items:center}
.qty .ic{width:18px;height:18px}
.qty .n{width:auto;min-width:18px;max-width:96px;padding:0 2px;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty input{width:84px;height:32px;margin:0 6px;border:0;border-radius:999px;background:var(--accInk);color:var(--ink);text-align:center;font:700 15px var(--body);outline:none}

/* Fields, buttons, panels */
.field{height:44px;border-radius:999px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mute)}
.field input,.field select{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;color:var(--ink);font:15px var(--body);appearance:none;-webkit-appearance:none}
.field .ic{width:18px;height:18px}
.field .okic{color:var(--ok)}
.field .okic.off{visibility:hidden}
.btn{height:48px;border:0;border-radius:999px;background:var(--acc);color:var(--accInk);font:400 16px var(--head);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn .ic{width:18px;height:18px}
.btn.sm{height:44px;font-size:15px}
.btn.grow{flex:1}
.btn:disabled{opacity:.6;cursor:default}
.outline{height:44px;padding:0 16px;flex:none;border:1px solid var(--line);border-radius:999px;background:transparent;font:400 14px var(--head);display:flex;align-items:center;justify-content:center;gap:6px}
.outline:hover{background:var(--a1)}
.outline .ic{width:16px;height:16px}
.link{height:44px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--a7);font:700 14px var(--body)}
.panel{margin-top:22px;background:var(--sf);border-radius:28px;padding:18px}
.ptitle{font:400 19px/1.2 var(--head);margin:0}
.ptext{font-size:14px;color:var(--mute);margin:4px 0 0}
.pact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.form{display:grid;gap:8px;margin-top:14px}
.addcard{margin-top:22px;background:var(--card);border-radius:24px;padding:16px}
.addcard .ptitle{font-size:17px}

/* Floating button + tab bar + toast */
.fab{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;height:60px;border:0;border-radius:999px;background:var(--acc);color:var(--accInk);display:flex;align-items:center;gap:10px;padding:0 10px 0 22px;box-shadow:0 12px 32px rgba(46,43,37,.28);z-index:6}
.fab .t{font:400 18px var(--head)}
.fab .m{margin-left:auto;font:600 13px var(--body);opacity:.9}
.fab .go{width:40px;height:40px;border-radius:999px;background:var(--accInk);color:var(--acc);display:grid;place-items:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px max(18px,calc((100% - 560px)/2)) max(14px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.tabbar button{border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font:600 12px var(--body)}
.tabbar .pill{height:32px;width:60px;border-radius:999px;display:grid;place-items:center}
.tabbar [aria-selected="true"]{color:var(--a7);font-weight:700}
.tabbar [aria-selected="true"] .pill{background:var(--a1)}
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* Review order */
.rhead{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px 12px}
.back{width:44px;height:44px;flex:none;border-radius:999px;border:0;background:var(--card);display:grid;place-items:center}
.back .ic{width:22px;height:22px}
.rtitle{font:400 26px/1.1 var(--head);margin:0}
.ctxline{border:0;background:none;padding:2px 0 0;color:var(--a7);font:600 13px var(--body);display:flex;align-items:center;gap:4px}
.ctxline .ic{width:14px;height:14px}
.cards{display:flex;flex-direction:column;gap:14px;padding:6px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:28px;padding:18px 18px 16px}
.chead{display:flex;align-items:center;gap:8px}
.cname{font:400 20px/1.15 var(--head);flex:1;min-width:0;margin:0}
.cut{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);margin-top:4px}
.cut .ic{width:14px;height:14px}
.lines{list-style:none;margin:14px 0;padding:10px 0;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.lines li{display:flex;gap:10px;font-size:15px}
.lines li span{flex:1;min-width:0}
.lines b{white-space:nowrap}
.bar{height:8px;border-radius:999px;background:var(--sf);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.summary{font-size:13px;color:var(--mute)}
.callout{display:flex;gap:8px;align-items:center;margin-top:10px;padding:9px 14px;border-radius:16px;background:var(--a1);color:var(--a7);font-size:13px;font-weight:600}
.callout .ic{width:16px;height:16px}
.callout .go{margin-left:auto;border:0;background:none;padding:0 0 0 8px;color:inherit;font:700 13px var(--body);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.callout.warn{background:var(--sf);color:var(--ink);font-weight:500}
.card .field{margin-top:10px}
.needs{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
.needs button{border:0;background:none;padding:0;color:var(--a7);font:700 13px var(--body);text-decoration:underline;text-underline-offset:3px}
.note{display:block;width:100%;margin-top:12px;min-height:64px;border:1px solid var(--line);border-radius:18px;background:var(--bg);padding:10px 14px;font:14px var(--body);resize:none}
.cact{display:flex;gap:8px;margin-top:14px;align-items:center}
.round{width:48px;height:48px;flex:none;border-radius:999px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.round .ic{width:19px;height:19px}

/* Sheets */
.backdrop{position:fixed;inset:0;background:rgba(28,25,22,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:32px 32px 0 0;padding:10px 20px calc(34px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(46,43,37,.2)}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 18px}
.stitle{font:400 24px/1.15 var(--head);margin:0}
.ssub{font-size:14px;color:var(--mute);margin:4px 0 0}
.bubble{margin-top:16px;background:var(--card);border-radius:22px 22px 22px 6px;padding:14px 16px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow-y:auto}
.primary{width:100%;margin-top:18px;height:54px;border:0;border-radius:999px;background:var(--acc);color:var(--accInk);font:400 17px var(--head);display:flex;align-items:center;justify-content:center;gap:10px}
.textbtn{width:100%;margin-top:8px;height:48px;border:0;border-radius:999px;background:none;font:600 15px var(--body)}
.textbtn.acc{color:var(--a7);font-weight:700}
.okc{width:64px;height:64px;border-radius:999px;background:var(--ok1);color:var(--ok);display:grid;place-items:center;margin-top:4px}
.okc .ic{width:30px;height:30px}
.sentt{font:400 28px/1.15 var(--head);margin:16px 0 0}
.lbl{font-size:13px;font-weight:600;color:var(--mute);margin:16px 0 8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:0;height:48px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font:600 15px var(--body);white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.dates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.date{height:64px;border-radius:20px;border:1px solid transparent;background:var(--card);font:600 13px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.date b{font:400 20px var(--head)}
.date[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.trows{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.trow{width:100%;height:56px;border-radius:999px;border:1.5px solid transparent;background:var(--card);padding:0 18px;font:600 15px var(--body);display:flex;align-items:center;gap:12px;text-align:left}
.trow .ic{color:var(--a7)}
.trow .dot{margin-left:auto;width:22px;height:22px;border-radius:999px;border:2px solid var(--line)}
.trow[aria-checked="true"]{background:var(--a1);border-color:var(--acc)}
.trow[aria-checked="true"] .dot{border-color:var(--acc);box-shadow:inset 0 0 0 5px var(--acc)}

/* Suppliers */
.intro{margin:6px 4px 14px;font-size:14px;color:var(--mute)}
.scards{display:flex;flex-direction:column;gap:10px}
.scard{background:var(--card);border-radius:24px;padding:14px 16px}
.shead{display:flex;align-items:center;gap:8px}
.sname{font-weight:700;font-size:15px;flex:1;min-width:0}
.sinfo{font-size:13px;color:var(--mute);margin-top:2px}
.scard .field{margin-top:10px}

/* History */
.hdate{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:16px 4px 8px}
.hlist{display:flex;flex-direction:column;gap:10px}
.hcard{background:var(--card);border-radius:24px;padding:14px 12px 14px 16px;display:flex;gap:12px;align-items:center}
.hsum{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* Welcome */
.welcome{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:max(28px,calc(env(safe-area-inset-top) + 20px)) 26px calc(32px + env(safe-area-inset-bottom))}
.wlogo{width:64px;height:64px;border-radius:999px;background:var(--acc);color:var(--accInk);display:grid;place-items:center}
.wlogo .ic{width:30px;height:30px}
.wh1{font:400 40px/1.08 var(--head);letter-spacing:-.015em;margin:28px 0 12px}
.wp{margin:0;color:var(--mute);font-size:16px;line-height:1.5}
.steps{list-style:none;margin:34px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
.steps li{display:flex;gap:14px;align-items:center;font-size:15px;font-weight:600}
.steps span{width:40px;height:40px;flex:none;border-radius:999px;background:var(--a1);color:var(--a7);display:grid;place-items:center}
.steps .ic{width:19px;height:19px}
.wbtns{margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:10px}
.wbtns .primary{margin-top:0}
.outline.big{height:54px;font-size:17px;color:var(--ink)}
.wnote{text-align:center;font-size:13px;color:var(--mute);margin-top:6px}
.wnote button{border:0;background:none;padding:0;color:var(--a7);font:700 13px var(--body);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
const SAMPLE = __DATA__;
const DATA_KEY = "supplier-orders-data";
function loadImported(){try{const v=JSON.parse(localStorage.getItem(DATA_KEY));return validData(v)?v:null}catch(e){return null}}
function validData(d){return !!d&&Array.isArray(d.items)&&Array.isArray(d.suppliers)&&d.items.every(i=>i&&i.n&&i.s&&i.id!=null)&&d.suppliers.every(s=>s&&s.n)}
const DATA = loadImported() || SAMPLE;
const OUTLETS = DATA.outlets&&DATA.outlets.length ? DATA.outlets : ["Main"];
const SUP = Object.fromEntries(DATA.suppliers.map(s => [s.n, s]));
const TYPE = {chat:"WhatsApp", online:"Online store", internal:"Internal", none:"Other"};
let st = { cart:{}, phones:{}, notes:{}, custom:[], history:[], outlet:OUTLETS[0] };
// UI state (not saved)
let chipMode="", tab="items", screen=null, sheet=null, q="", filter=null, editing=null, noteOpen={}, undo=null, syncText="Saved on this device";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const allItems = () => DATA.items.concat(st.custom);
const byId = id => allItems().find(i => String(i.id) === String(id));
const money = n => "$" + (Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"");
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}

/* ---------- delivery dates ---------- */
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
// The next four delivery days from tomorrow, skipping Sundays
const DAYS = (()=>{const out=[], d=new Date();d.setHours(0,0,0,0);while(out.length<4){d.setDate(d.getDate()+1);if(d.getDay()!==0)out.push(new Date(d))}return out})();
let deliv = 0;
const pad2 = n => String(n).padStart(2,"0");
const isoD = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
// Use the saved delivery date while it's still one of the upcoming options; otherwise tomorrow
const syncDeliv = () => {const i=DAYS.findIndex(d=>isoD(d)===st.delivery);deliv=i<0?0:i};
// Reads a supplier's free-text cut-off for two rules: delivery-day limits ("Delivers Mondays only")
// and a same-day order cut-off for next-day delivery ("Order by 4pm", "Weekday before 5pm, Sat before 12pm").
const DAYNAMES=["sun","mon","tue","wed","thu","fri","sat"];
function dateClash(sp){
  const t=(sp&&sp.cut||"").toLowerCase(), d=DAYS[deliv];
  if(!t) return "";
  const only=t.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\s+only\b/);
  if(only){const want=DAYNAMES.indexOf(only[1]);if(d.getDay()!==want)return `Only delivers on ${DOW[want]}days. You picked ${fmtD(d)}.`;return ""}
  if(isTomorrow(d)){
    const now=new Date(), sat=now.getDay()===6;
    const m=(sat&&t.match(/sat[a-z]*\s+(?:before\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)/))||t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
    if(m){const h=(+m[1]%12)+(m[3]==="pm"?12:0), mins=h*60+(+(m[2]||0));
      if(now.getHours()*60+now.getMinutes()>=mins) return `It's past today's ${m[1]}${m[2]?":"+m[2]:""}${m[3]} cut-off, so ${fmtD(d)} delivery may not happen.`}
  }
  return "";
}
const isTomorrow = d => {const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+1);return d.getTime()===t.getTime()};

/* ---------- sync between phones (Supabase) ---------- */
const SYNC = __SYNC__;
const SYNC_ON = !!(SYNC&&SYNC.url&&SYNC.key);
const SUPA_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js";
let sb=null, user=null, pending=false, pushT=null;
const syncMsg=t=>{syncText=t;const e=$("#sync");if(e)e.textContent=t};
const offline=()=>{syncMsg("Offline. Will sync when back online")};
const lastSync=()=>{try{return +localStorage.getItem("supplier-orders-synced")||0}catch(e){return 0}};
const markSynced=()=>{try{localStorage.setItem("supplier-orders-synced",Date.now())}catch(e){}syncMsg("Synced")};
function rawData(){try{return JSON.parse(localStorage.getItem(DATA_KEY))}catch(e){return null}}
const dataStamp=d=>d&&d.importedAt||"";
function schedulePush(){if(!user)return;pending=true;clearTimeout(pushT);pushT=setTimeout(push,1000)}
async function push(){
  if(!user||!pending)return;
  if(!navigator.onLine)return offline();
  const row={user_id:user.id,state:st,updated_at:new Date(st.updatedAt||Date.now()).toISOString()};
  const d=rawData();if(d)row.data=d;
  const {error}=await sb.from("app_state").upsert(row);
  if(error)return syncMsg("Couldn't sync. Saved on this device");
  pending=false;markSynced();
}
async function pull(preferRemote){
  if(!user)return;
  if(!navigator.onLine)return offline();
  const {data:row,error}=await sb.from("app_state").select("state,data,updated_at").maybeSingle();
  if(error)return syncMsg("Couldn't sync. Saved on this device");
  let reload=false;
  const rd=row&&row.data&&(validData(row.data)||row.data.sample)?row.data:null;
  if(rd&&(preferRemote||dataStamp(rd)>dataStamp(rawData()))){
    if(dataStamp(rd)!==dataStamp(rawData())){try{localStorage.setItem(DATA_KEY,JSON.stringify(rd));reload=true}catch(e){}}
  }else if(dataStamp(rawData())>dataStamp(rd))pending=true;
  const rt=row?Date.parse(row.updated_at):0, lt=st.updatedAt||0;
  if(row&&row.state&&(preferRemote||rt>lt)){
    st=Object.assign({cart:{},phones:{},notes:{},custom:[],history:[],outlet:OUTLETS[0]},row.state,{updatedAt:rt});saveLocal();
  }else if(!row||lt>rt)pending=true;
  if(pending)await push();else markSynced();
  if(reload)return location.reload();
  render();
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function initSync(){
  if(!SYNC_ON)return;
  try{
    await loadScript(SUPA_JS);
    sb=supabase.createClient(SYNC.url,SYNC.key);
    const {data}=await sb.auth.getSession();
    user=data.session?data.session.user:null;
    if(user)await pull();else if(tab==="suppliers")render();
  }catch(e){syncMsg(navigator.onLine?"Couldn't load sync. Saved on this device":"Offline. Saved on this device");if(tab==="suppliers")render()}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
window.addEventListener("online",()=>pull());

/* ---------- cart helpers ---------- */
const qtyNum = v => {const m=String(v||"").match(/[\d.]+/);return m?parseFloat(m[0]):0};
function setQty(id,v){
  v=String(v).trim();
  if(!v||v==="0") delete st.cart[id]; else st.cart[id]=v;
  save();
}
function bump(id,d){
  const cur=st.cart[id]||"0", n=qtyNum(cur), unit=String(cur).replace(/^[\d.]+\s*/,"");
  const next=Math.max(0,n+d);
  setQty(id,next?(next+(unit?" "+unit:"")):"");
}
function cartBySupplier(){
  const g={};
  for(const [id,q] of Object.entries(st.cart)){const it=byId(id);if(!it)continue;(g[it.s]=g[it.s]||[]).push({it,q})}
  return g;
}
function addLines(lines){lines.forEach(l=>{if(byId(l.id))st.cart[l.id]=l.q});save();render();toast("Added to order")}
function message(sup,lines){
  const note=(st.notes[sup]||"").trim();
  let m=`Hi ${sup}, order for ${[DATA.business,st.outlet].filter(Boolean).join(" ")}, delivery ${fmtD(DAYS[deliv])}:\n\n`;
  m+=lines.map(l=>`• ${l.it.n} × ${l.q}`).join("\n");
  if(note) m+=`\n\n${note}`;
  return m+"\n\nThank you!";
}
function sendText(s){const lines=cartBySupplier()[s]||[];return (SUP[s]||{}).t==="online"?lines.map(l=>`${l.it.n} × ${l.q}`).join("\n"):message(s,lines)}
function kindOf(s){const sp=SUP[s]||{t:"chat"};if(sp.t==="online")return "online";if(sp.t==="internal")return "internal";return st.phones[s]?"wa":"copy"}
function waNumber(p){let d=String(p||"").replace(/\D/g,"");if(d.length===8)d="65"+d;return d}
const ctxLabel = () => `${st.outlet} · ${fmtD(DAYS[deliv])}`;

  const tabs=[["items","Items","package"],["suppliers","Suppliers","truck"],["history","History","history"]]
    .map(([id,l,i])=>`<button role="tab" aria-selected="${tab===id}" data-act="tab" data-v="${id}"><span class="pill">${ic(i)}</span>${l}</button>`).join("");
  return `<div class="wrap">${headerHTML()}<main id="content" class="${fab?"withfab":""}">${content}</main></div>${fab}<nav class="tabbar" role="tablist">${tabs}</nav>`;
}
function orderHTML(){
  const g=cartBySupplier(), keys=Object.keys(g).sort();
  const cards=keys.map(s=>{
    const sp=SUP[s]||{t:"chat"}, lines=g[s], kind=kindOf(s);
    const priced=lines.filter(l=>l.it.p!=null), total=priced.reduce((a,l)=>a+l.it.p*qtyNum(l.q),0), allPriced=priced.length===lines.length;
    let summary="No prices listed", bar="", below="";
    if(sp.mn&&priced.length){
      const pct=Math.min(100,total/sp.mn*100);
      bar=`<div class="bar" role="progressbar" aria-label="Minimum order" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
      summary=`${allPriced?"":"About "}${money(total)} of ${esc(sp.m)} minimum`;
      if(total<sp.mn) below=`<div class="callout">${ic("info")}Add ${money(sp.mn-total)} to reach the minimum<button class="go" data-act="additems" data-v="${esc(s)}">Add items</button></div>`;
    }else if(priced.length) summary=`${allPriced?"Total":"About"} ${money(total)}`;
    const act={wa:["Send on WhatsApp","message-circle"],copy:["Copy message","copy"],online:["Copy shopping list","copy"],internal:["Copy request","copy"]}[kind];
    const open=noteOpen[s]||!!st.notes[s], clash=dateClash(SUP[s]);
    return `<article class="card"><div class="chead"><h2 class="cname">${esc(s)}</h2><span class="tag plain">${TYPE[sp.t]||"Supplier"}</span></div>
      ${sp.cut?`<div class="cut">${ic("clock")}${esc(sp.cut)}</div>`:""}${sp.note?`<div class="cut">${ic("info")}${esc(sp.note)}</div>`:""}
      ${clash?`<div class="callout warn">${ic("clock")}${esc(clash)}</div>`:""}
      <ul class="lines">${lines.map(l=>`<li><span>${esc(l.it.n)}</span><b>× ${esc(l.q)}</b></li>`).join("")}</ul>
      ${bar}<div class="summary">${summary}</div>${below}
      ${kind==="copy"&&sp.t==="chat"?`<label class="field">${ic("message-circle")}<input inputmode="tel" enterkeyhint="done" data-phone="${esc(s)}" data-card="1" placeholder="Add WhatsApp number" aria-label="WhatsApp number for ${esc(s)}"></label>`:""}
      ${open?`<textarea class="note" data-note="${esc(s)}" placeholder="Note for this supplier" aria-label="Note for ${esc(s)}">${esc(st.notes[s]||"")}</textarea>`:""}
      <div class="cact"><button class="btn grow" data-act="send" data-v="${esc(s)}">${ic(act[1])}${act[0]}</button>
      ${open?"":`<button class="round" data-act="note" data-v="${esc(s)}" aria-label="Add note for ${esc(s)}">${ic("sticky-note")}</button>`}</div></article>`;
  }).join("");
  return `<div class="wrap"><div class="rhead"><button class="back" data-act="back" aria-label="Back">${ic("chevron-left")}</button>
    <div style="min-width:0"><h1 class="rtitle">Review order</h1><button class="ctxline" data-act="ctx">${esc(ctxLabel())}${ic("chevron-down")}</button></div></div>
    <div class="cards">${cards||`<p class="empty"><b>All orders sent</b>Nothing left to send.</p>`}</div></div>`;
}
function welcomeHTML(){
  const steps=[["package","Pick items by supplier or cocktail"],["scale","See minimums and cut-off times"],["message-circle","Send each order on WhatsApp"]];
  return `<div class="welcome"><div class="wlogo">${ic("receipt")}</div>
    <h1 class="wh1">Supplier orders in a few taps</h1>
    <p class="wp">Pick what the bar needs, check each supplier's minimum, and send the order on WhatsApp.</p>
    <ul class="steps">${steps.map(([i,t])=>`<li><span>${ic(i)}</span>${t}</li>`).join("")}</ul>
    <div class="wbtns"><button class="primary" data-act="import">${ic("upload")}Import my data.json</button>
    <button class="outline big" data-act="start">Try with sample data</button>
    <div class="wnote">Your data stays on this phone.</div>
    ${SYNC_ON?`<div class="wnote">Already set up on another phone? <button data-act="signinlink">Sign in</button></div>`:""}</div></div>`;
}
function sheetHTML(){
  const sh=sheet;
  if(sh.type==="ctx") return `<h2 class="stitle" id="stitle">Delivery</h2>
    <div class="lbl">Outlet</div><div class="opts">${OUTLETS.map(o=>`<button class="opt" aria-pressed="${st.outlet===o}" data-act="outlet" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div class="lbl">Delivery date</div><div class="dates">${DAYS.map((d,i)=>`<button class="date" aria-pressed="${deliv===i}" data-act="date" data-v="${i}" aria-label="${fmtD(d)}"><span>${i===0&&isTomorrow(d)?"Tmrw":DOW[d.getDay()]}</span><b>${d.getDate()}</b></button>`).join("")}</div>
    <button class="primary" data-act="close" style="margin-top:22px">Done</button>`;
  if(sh.type==="theme"){const t=getTheme();return `<h2 class="stitle" id="stitle">Appearance</h2><p class="ssub">System follows your phone's light or dark setting.</p>
    <div class="trows" role="radiogroup">${[["system","System","smartphone"],["light","Light","sun"],["dark","Dark","moon"]].map(([id,l,i])=>
      `<button class="trow" role="radio" aria-checked="${t===id}" data-act="settheme" data-v="${id}">${ic(i)}${l}<span class="dot"></span></button>`).join("")}</div>
    <button class="primary" data-act="close" style="margin-top:20px">Done</button>`}
  if(sh.type==="send"){
    const s=sh.s, kind=kindOf(s);
    const sub=kind==="wa"?`Opens WhatsApp to ${esc(st.phones[s])} with this message`:kind==="online"?`${esc(s)} is an online store. Copy and paste into your cart.`:"Copy and paste this message to the supplier";
    return `<h2 class="stitle" id="stitle">${kind==="online"?"Shopping list":`Send to ${esc(s)}`}</h2><p class="ssub">${sub}</p>
      <div class="bubble">${esc(sendText(s))}</div>
      <button class="primary" data-act="confirm">${kind==="wa"?ic("message-circle")+"Open WhatsApp":ic("copy")+"Copy"}</button>
      <button class="textbtn" data-act="close">Cancel</button>`;
  }
  if(sh.type==="ask"){
    const k=sh.kind, s=esc(sh.s);
    return `<h2 class="stitle" id="stitle">${k==="wa"?`Sent to ${s}?`:k==="online"?`Ordered from ${s}?`:`Copied. Sent to ${s}?`}</h2>
      <p class="ssub">${k==="wa"?"Tap Yes once the message has gone in WhatsApp.":"Tap Yes once you've sent it."} It'll be saved to History.</p>
      <button class="primary" data-act="yes">${ic("check")}Yes, sent</button>
      <button class="textbtn acc" data-act="reopen">${k==="wa"?"Open WhatsApp again":"Copy again"}</button>
      <button class="textbtn" data-act="close">Not yet</button>`;
  }
  if(sh.type==="sent"){
    const left=Object.keys(cartBySupplier()).sort();
    return `<div class="okc">${ic("check")}</div><h2 class="sentt" id="stitle">Order sent</h2>
      <p class="ssub" style="font-size:15px">${esc(sh.s)}, ${plural(sh.n,"item")}. Saved to History.</p>
      <button class="primary" data-act="next" style="margin-top:24px">${left.length?`Next: ${esc(left[0])}`:"Done"}</button>
      <button class="textbtn acc" data-act="undo">Undo</button>`;
  }
  return "";
}
function renderSheet(){
  const r=$("#sheet");
  document.body.classList.toggle("locked",!!sheet);
  r.innerHTML=sheet?`<div class="backdrop" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle"><div class="grab"></div>${sheetHTML()}</div>`:"";
}
function render(){
  if(!OUTLETS.includes(st.outlet)) st.outlet=OUTLETS[0];
  syncDeliv();
  if(filter&&filter.type==="o"&&!Object.keys(cartBySupplier()).length) filter=null;
  if(filter&&filter.type==="k") chipMode="k";
  const c=$("#chips"), sl=c?c.scrollLeft:0;
  $("#app").innerHTML=screen==="welcome"?welcomeHTML():screen==="order"?orderHTML():tabsHTML();
  const c2=$("#chips"); if(c2) c2.scrollLeft=sl;
  const e=$("#qedit"); if(e){e.focus();e.select()}
  renderSheet();
}

/* ---------- actions ---------- */
// Opens WhatsApp (or copies), then asks whether it was really sent before saving to History
async function deliver(s,kind){
  const msg=sendText(s);
  if(kind==="wa") window.open(`https://wa.me/${waNumber(st.phones[s])}?text=${encodeURIComponent(msg)}`,"_blank","noopener");
  else{try{await navigator.clipboard.writeText(msg)}catch(err){prompt("Copy this message:",msg)}}
}
async function confirmSend(){
  const s=sheet.s, kind=kindOf(s);
  await deliver(s,kind);
  sheet={type:"ask",s,kind}; renderSheet();
}
function markSent(s,kind){
  const lines=cartBySupplier()[s]||[];
  undo={cart:{...st.cart},history:st.history.slice(),notes:{...st.notes}};
  st.history.unshift({s,date:new Date().toISOString(),outlet:st.outlet,lines:lines.map(l=>({id:l.it.id,q:l.q}))});
  st.history=st.history.slice(0,60);
  lines.forEach(l=>delete st.cart[l.it.id]); delete st.notes[s]; delete noteOpen[s];
  save(); sheet={type:"sent",s,n:lines.length,kind}; render();
}
function commitEdit(inp){if(editing===null)return;editing=null;setQty(inp.dataset.id,inp.value);render()}
function importFile(f){
  f.text().then(txt=>{
    let d;try{d=JSON.parse(txt)}catch(err){}
    $("#file").value="";
    if(!validData(d)){toast("That file isn't a valid data.json");return}
    d.importedAt=new Date().toISOString();
    try{localStorage.setItem(DATA_KEY,JSON.stringify(d))}catch(err){toast("Couldn't save. Phone storage full?");return}
    if(screen==="welcome") save();
    location.reload();
  });
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act, id=b.dataset.id, v=b.dataset.v;
  if(a==="tab"){tab=v;editing=null;render();window.scrollTo(0,0)}
  else if(a==="inc"){editing=null;bump(id,1);render()}
  else if(a==="dec"){bump(id,-1);render()}
  else if(a==="edit"){editing=id;render()}
  else if(a==="filter"){filter=b.dataset.t?{type:b.dataset.t,v}:null;render();window.scrollTo(0,0)}
  else if(a==="clearq"){q="";render();$("#q").focus()}
  else if(a==="repeat"){const last=st.history.find(x=>x.s===v);if(last)addLines(last.lines)}
  else if(a==="hrepeat"){const h=st.history[+b.dataset.i];if(h)addLines(h.lines)}
  else if(a==="review"){screen="order";render();window.scrollTo(0,0)}
  else if(a==="back"){screen=null;render();window.scrollTo(0,0)}
  else if(a==="ctx"){sheet={type:"ctx"};renderSheet()}
  else if(a==="theme"){sheet={type:"theme"};renderSheet()}
  else if(a==="close"){sheet=null;render()}
  else if(a==="outlet"){st.outlet=v;save();renderSheet()}
  else if(a==="date"){st.delivery=isoD(DAYS[+v]);save();syncDeliv();renderSheet()}
  else if(a==="settheme"){setTheme(v);renderSheet()}
  else if(a==="send"){sheet={type:"send",s:v};renderSheet()}
  else if(a==="confirm"){await confirmSend()}
  else if(a==="yes"){markSent(sheet.s,sheet.kind)}
  else if(a==="reopen"){await deliver(sheet.s,sheet.kind)}
  else if(a==="additems"){screen=null;tab="items";q="";chipMode="";filter={type:"s",v};render();window.scrollTo(0,0)}
  else if(a==="chipmode"){chipMode=v;if(!v&&filter&&filter.type==="k")filter=null;render();const c=$("#chips");if(c)c.scrollLeft=0}
  else if(a==="next"){const left=Object.keys(cartBySupplier()).sort();
    if(left.length){sheet={type:"send",s:left[0]};renderSheet()}else{sheet=null;screen=null;tab="items";render();window.scrollTo(0,0)}}
  else if(a==="undo"){if(undo){Object.assign(st,undo);undo=null;save()}sheet=null;render()}
  else if(a==="note"){noteOpen[v]=true;render();const t=document.querySelector(`[data-note="${CSS.escape(v)}"]`);if(t)t.focus()}
  else if(a==="gosup"){screen=null;tab="suppliers";render();window.scrollTo(0,0)}
  else if(a==="import"){$("#file").click()}
  else if(a==="start"){screen=null;tab="items";save();render()}
  else if(a==="welcome"){screen="welcome";render();window.scrollTo(0,0)}
  else if(a==="signinlink"){screen=null;tab="suppliers";save();render();const c=$("#synccard");if(c)c.scrollIntoView({block:"start"})}
  else if(a==="usesample"){if(confirm("Switch back to the sample data? You can import your file again any time.")){try{localStorage.setItem(DATA_KEY,JSON.stringify({sample:true,importedAt:new Date().toISOString()}))}catch(err){}location.reload()}}
  else if(a==="signout"){await sb.auth.signOut();user=null;syncMsg("Saved on this device");render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){q=t.value;$("#content").innerHTML=itemsContent();t.parentNode.querySelector(".clear").hidden=!q}
  else if(t.dataset.note!==undefined){st.notes[t.dataset.note]=t.value;save()}
  else if(t.dataset.phone!==undefined){st.phones[t.dataset.phone]=t.value.trim();save();const ok=t.parentNode.querySelector(".okic");if(ok)ok.classList.toggle("off",!t.value.trim());
    // On a review card, switch the send button as soon as a number is typed (no re-render, so the next tap isn't lost)
    if(t.dataset.card){const b=t.closest(".card").querySelector('[data-act="send"]');if(b)b.innerHTML=t.value.trim()?ic("message-circle")+"Send on WhatsApp":ic("copy")+"Copy message"}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="file"&&t.files[0])importFile(t.files[0]);
});
document.addEventListener("focusout",e=>{if(e.target.id==="qedit")commitEdit(e.target)});
document.addEventListener("keydown",e=>{
  if((e.target.id==="qedit"||e.target.dataset.card)&&e.key==="Enter"){e.preventDefault();e.target.blur()}
  else if(e.key==="Escape"&&sheet){sheet=null;render()}
});
document.addEventListener("submit",async e=>{
  const f0=e.target;
  if(f0.id==="signin"){
    e.preventDefault();
    const create=e.submitter&&e.submitter.value==="up", btns=f0.querySelectorAll("button");
    const email=f0.email.value.trim(), password=f0.password.value;
    btns.forEach(x=>x.disabled=true);
    const {data,error}=create?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
    btns.forEach(x=>x.disabled=false);
    if(!navigator.onLine)return toast("You're offline");
    if(error)return toast(create?(/registered|exists/i.test(error.message)?"Account exists. Use Sign in":"Couldn't create the account"):"Wrong email or password");
    if(!data.session)return toast("Turn off 'Confirm email' in Supabase, then try again");
    user=data.user;toast("Signed in. Sync is on");await pull(true);
    return;
  }
  if(f0.id!=="add")return;e.preventDefault();
  const f=new FormData(f0),n=f.get("n").trim();if(!n)return;
  st.custom.push({id:"c"+Date.now(),n,s:f.get("s")});save();q=n;filter=null;render();toast("Item added");
});

applyTheme();
const firstRun=(()=>{try{return !localStorage.getItem("supplier-orders")&&!localStorage.getItem(DATA_KEY)}catch(e){return false}})();
loadLocal(); if(firstRun) screen="welcome";
render(); initSync();
if("serviceWorker" in navigator&&location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
